name: Bootstrap repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate Codex port
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          git clone https://github.com/mattpocock/skills.git /tmp/matt-skills
          cd /tmp/matt-skills
          git checkout b8be62ffacb0118fa3eaa29a0923c87c8c11985c
          cd "$GITHUB_WORKSPACE"

          mkdir -p skills tests
          cp /tmp/matt-skills/LICENSE LICENSE

          copy_skill() {
            src="$1"
            dest="$2"
            cp -R "/tmp/matt-skills/skills/$src" "skills/$dest"
          }

          copy_skill engineering/diagnose diagnose
          copy_skill engineering/grill-with-docs grill-with-docs
          copy_skill engineering/triage triage
          copy_skill engineering/improve-codebase-architecture improve-codebase-architecture
          copy_skill engineering/setup-matt-pocock-skills setup-real-engineer-skills
          copy_skill engineering/tdd tdd
          copy_skill engineering/to-issues to-issues
          copy_skill engineering/to-prd to-prd
          copy_skill engineering/zoom-out zoom-out
          copy_skill engineering/prototype prototype
          copy_skill productivity/caveman caveman
          copy_skill productivity/grill-me grill-me
          copy_skill productivity/handoff handoff
          copy_skill productivity/write-a-skill write-a-skill

          python3 <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          root = Path('.')
          skills = root / 'skills'

          def rw(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]}')
              p.write_text(text.replace(old, new))

          for p in skills.rglob('SKILL.md'):
              text = p.read_text()
              text = re.sub(r'^disable-model-invocation: true\n', '', text, flags=re.M)
              text = re.sub(r'^argument-hint: .*\n', '', text, flags=re.M)
              p.write_text(text)

          rw('skills/setup-real-engineer-skills/SKILL.md', 'name: setup-matt-pocock-skills', 'name: setup-real-engineer-skills')
          rw('skills/setup-real-engineer-skills/SKILL.md', "description: Sets up an `## Agent skills` block in AGENTS.md/CLAUDE.md and `docs/agents/` so the engineering skills know this repo's issue tracker (GitHub or local markdown), triage label vocabulary, and domain doc layout. Run before first use of `to-issues`, `to-prd`, `triage`, `diagnose`, `tdd`, `improve-codebase-architecture`, or `zoom-out` — or if those skills appear to be missing context about the issue tracker, triage labels, or domain docs.", "description: Sets up Codex project instructions in AGENTS.md plus docs/agents/ so the real-engineer skills know the repo's issue tracker, triage label vocabulary, and domain doc layout. Use before first use of to-issues, to-prd, triage, diagnose, tdd, improve-codebase-architecture, or zoom-out, or when those skills lack project context.")
          rw('skills/setup-real-engineer-skills/SKILL.md', "# Setup Matt Pocock's Skills", '# Setup Real Engineer Skills for Codex')
          rw('skills/setup-real-engineer-skills/SKILL.md', '`AGENTS.md` and `CLAUDE.md` at the repo root — does either exist? Is there already an `## Agent skills` section in either?', '`AGENTS.md` and `CLAUDE.md` at the repo root — does either exist? Is there already an `## Agent skills` section in either? Codex reads `AGENTS.md`; `CLAUDE.md` is only checked to avoid conflicting project instructions.')
          rw('skills/setup-real-engineer-skills/SKILL.md', 'they need to know whether to call `gh issue create`, write a markdown file under `.scratch/`, or follow some other workflow you describe.', 'they need to know whether to use the Codex GitHub connector, call `gh issue create`, write a markdown file under `.scratch/`, or follow some other workflow you describe.')
          rw('skills/setup-real-engineer-skills/SKILL.md', '**GitHub** — issues live in the repo\'s GitHub Issues (uses the `gh` CLI)', '**GitHub** — issues live in the repo\'s GitHub Issues (prefer the Codex GitHub connector when available; otherwise use the `gh` CLI)')
          rw('skills/setup-real-engineer-skills/SKILL.md', 'The `## Agent skills` block to add to whichever of `CLAUDE.md` / `AGENTS.md` is being edited (see step 4 for selection rules)', 'The `## Agent skills` block to add to `AGENTS.md` (see step 4 for selection rules)')
          rw('skills/setup-real-engineer-skills/SKILL.md', dedent('''\
          **Pick the file to edit:**

          - If `CLAUDE.md` exists, edit it.
          - Else if `AGENTS.md` exists, edit it.
          - If neither exists, ask the user which one to create — don't pick for them.

          Never create `AGENTS.md` when `CLAUDE.md` already exists (or vice versa) — always edit the one that's already there.
          '''), dedent('''\
          **Pick the file to edit:**

          - If `AGENTS.md` exists, edit it.
          - If `AGENTS.md` does not exist, create it for Codex.
          - If `CLAUDE.md` exists, read it first and avoid contradicting it. Do not edit `CLAUDE.md` unless the user explicitly asks to keep Claude instructions in sync too.
          '''))

          for rel in ['skills/to-prd/SKILL.md', 'skills/to-issues/SKILL.md']:
              p = root / rel
              p.write_text(p.read_text().replace('run `/setup-matt-pocock-skills` if not', 'invoke `setup-real-engineer-skills` if not'))

          p = root / 'skills/triage/SKILL.md'
          text = p.read_text()
          text = text.replace('run `/setup-matt-pocock-skills` if not', 'invoke `setup-real-engineer-skills` if not')
          text = text.replace('The maintainer invokes `/triage` and describes what they want in natural language.', 'The maintainer invokes `triage` or describes what they want in natural language.')
          text = text.replace('run a `/grill-with-docs` session', 'run a `grill-with-docs` session')
          p.write_text(text)

          rw('skills/caveman/SKILL.md', '"less tokens", "be brief", or invokes /caveman.', '"less tokens", "be brief", or invokes caveman.')
          rw('skills/handoff/SKILL.md', 'description: Compact the current conversation into a handoff document for another agent to pick up.', 'description: Compact the current conversation into a handoff document for another agent to pick up. Use when the user wants to hand work to a fresh session, preserve context before compaction, or create a continuation brief.')
          rw('skills/setup-real-engineer-skills/domain.md', '`/grill-with-docs`', '`grill-with-docs`')
          rw('skills/setup-real-engineer-skills/issue-tracker-github.md', 'Issues and PRDs for this repo live as GitHub issues. Use the `gh` CLI for all operations.', 'Issues and PRDs for this repo live as GitHub issues. Prefer the Codex GitHub connector when it is available; otherwise use the `gh` CLI.')
          rw('skills/setup-real-engineer-skills/issue-tracker-github.md', '**Create an issue**: `gh issue create --title "..." --body "..."`. Use a heredoc for multi-line bodies.', '**Create an issue**: use the GitHub connector\'s create-issue action, or `gh issue create --title "..." --body "..."`. Use a heredoc for multi-line bodies when using `gh`.')
          rw('skills/setup-real-engineer-skills/issue-tracker-github.md', 'Infer the repo from `git remote -v` — `gh` does this automatically when run inside a clone.', 'Infer the repo from `git remote -v`. The Codex connector needs `owner/name`; `gh` infers it automatically when run inside a clone.')
          rw('skills/setup-real-engineer-skills/issue-tracker-github.md', 'Run `gh issue view <number> --comments`.', 'Use the GitHub connector to fetch the issue, or run `gh issue view <number> --comments`.')

          rw('skills/improve-codebase-architecture/SKILL.md', 'Then use the Agent tool with `subagent_type=Explore` to walk the codebase. Don\'t follow rigid heuristics — explore organically and note where you experience friction:', 'Then explore the codebase organically and note where you experience friction. If Codex multi-agent tools are available, spawn one or more explorer agents; otherwise use `rg`, file reads, tests, and call graph inspection yourself. Don\'t follow rigid heuristics:')
          rw('skills/improve-codebase-architecture/SKILL.md', 'same discipline as `/grill-with-docs`', 'same discipline as `grill-with-docs`')
          p = root / 'skills/improve-codebase-architecture/INTERFACE-DESIGN.md'
          text = p.read_text()
          text = text.replace('parallel sub-agent pattern', 'parallel design pattern')
          text = text.replace('Before spawning sub-agents', 'Before spawning design passes')
          text = text.replace('while the sub-agents work in parallel', 'while the design passes run in parallel')
          text = text.replace('### 2. Spawn sub-agents', '### 2. Run parallel design passes')
          text = text.replace('Spawn 3+ sub-agents in parallel using the Agent tool. Each must produce a **radically different** interface for the deepened module.', 'Run 3+ independent design passes in parallel if Codex multi-agent tools are available; otherwise do the passes yourself and keep the alternatives clearly separated. Each pass must produce a **radically different** interface for the deepened module.')
          text = text.replace('Prompt each sub-agent with a separate technical brief', 'Give each pass a separate technical brief')
          text = text.replace('Give each agent a different design constraint', 'Give each pass a different design constraint')
          text = text.replace('each sub-agent names', 'each pass names')
          text = text.replace('Each sub-agent outputs', 'Each pass outputs')
          p.write_text(text)

          meta = {
              'caveman': ('Caveman', 'Ultra-compressed technical replies', 'Use $caveman to answer in ultra-compressed technical mode.'),
              'diagnose': ('Diagnose', 'Disciplined debugging workflow', 'Use $diagnose to debug this failure with a reproducible feedback loop.'),
              'grill-me': ('Grill Me', 'Interactive plan stress testing', 'Use $grill-me to stress-test this plan one question at a time.'),
              'grill-with-docs': ('Grill with Docs', 'Domain-aware plan clarification', 'Use $grill-with-docs to clarify this plan against the repo domain docs.'),
              'handoff': ('Handoff', 'Continuation briefs for agents', 'Use $handoff to write a concise continuation brief for a fresh agent.'),
              'improve-codebase-architecture': ('Improve Codebase Architecture', 'Codebase architecture review', 'Use $improve-codebase-architecture to find deepening opportunities in this repo.'),
              'prototype': ('Prototype', 'Throwaway design prototypes', 'Use $prototype to build a throwaway prototype that answers this design question.'),
              'setup-real-engineer-skills': ('Setup Real Engineer Skills', 'Configure real-engineer context', 'Use $setup-real-engineer-skills to configure this repo for the real-engineer skill set.'),
              'tdd': ('TDD', 'Test-driven development workflow', 'Use $tdd to implement this change with red-green-refactor.'),
              'to-issues': ('To Issues', 'Vertical-slice issue planning', 'Use $to-issues to break this PRD into vertical-slice implementation issues.'),
              'to-prd': ('To PRD', 'PRD drafting from context', 'Use $to-prd to turn the current context into a PRD issue.'),
              'triage': ('Triage', 'Issue triage state machine', 'Use $triage to classify and prepare these issues for action.'),
              'write-a-skill': ('Write a Skill', 'Create Codex skills cleanly', 'Use $write-a-skill to draft a concise Codex skill.'),
              'zoom-out': ('Zoom Out', 'System-context code mapping', 'Use $zoom-out to explain how this code fits into the larger system.'),
          }
          for name, (display, short, prompt) in meta.items():
              d = skills / name / 'agents'
              d.mkdir(exist_ok=True)
              (d / 'openai.yaml').write_text(f'interface:\n  display_name: "{display}"\n  short_description: "{short}"\n  default_prompt: "{prompt}"\n')

          (root / '.gitignore').write_text('.DS_Store\n*.pyc\n__pycache__/\n')
          (root / 'README.md').write_text(dedent('''\
          # Skills For Real Engineers for Codex

          [![GitHub stars](https://img.shields.io/github/stars/ArcQian-bit/codex-skills-for-real-engineers?style=social)](https://github.com/ArcQian-bit/codex-skills-for-real-engineers/stargazers)
          [![Source](https://img.shields.io/badge/source-mattpocock%2Fskills-blue)](https://github.com/mattpocock/skills)

          A Codex port of Matt Pocock's **Skills For Real Engineers**. The goal is a function-complete migration of the public upstream plugin skill set into native Codex skill folders, with Codex project setup, GitHub connector guidance, and `agents/openai.yaml` metadata.

          This is an independent Codex adaptation, not the upstream official repository.
          Upstream source: https://github.com/mattpocock/skills

          ## Quick Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/ArcQian-bit/codex-skills-for-real-engineers/main/install.sh | bash
          ```

          Install selected skills:

          ```bash
          CODEX_REAL_ENGINEER_SKILLS=tdd,diagnose,grill-with-docs \\
            curl -fsSL https://raw.githubusercontent.com/ArcQian-bit/codex-skills-for-real-engineers/main/install.sh | bash
          ```

          Restart Codex after installation so the new skills are discovered.

          ## Included Skills

          | Codex skill | Upstream source | Purpose |
          | --- | --- | --- |
          | `diagnose` | `skills/engineering/diagnose` | Build a reproducible feedback loop before fixing hard bugs and regressions. |
          | `grill-with-docs` | `skills/engineering/grill-with-docs` | Stress-test plans against project domain language and ADRs. |
          | `triage` | `skills/engineering/triage` | Move issues through a maintainer/agent triage state machine. |
          | `improve-codebase-architecture` | `skills/engineering/improve-codebase-architecture` | Find shallow modules and propose deeper, more testable shapes. |
          | `setup-real-engineer-skills` | `skills/engineering/setup-matt-pocock-skills` | Configure `AGENTS.md` and `docs/agents/` for Codex. |
          | `tdd` | `skills/engineering/tdd` | Work in red/green/refactor vertical slices. |
          | `to-issues` | `skills/engineering/to-issues` | Break PRDs and plans into independently grabbable issues. |
          | `to-prd` | `skills/engineering/to-prd` | Turn existing conversation context into a PRD issue. |
          | `zoom-out` | `skills/engineering/zoom-out` | Map a code area in broader system context. |
          | `prototype` | `skills/engineering/prototype` | Build throwaway logic or UI prototypes to answer design questions. |
          | `caveman` | `skills/productivity/caveman` | Use terse, high-signal technical communication. |
          | `grill-me` | `skills/productivity/grill-me` | Interview a plan until the decision tree is resolved. |
          | `handoff` | `skills/productivity/handoff` | Write a continuation brief for another agent or fresh session. |
          | `write-a-skill` | `skills/productivity/write-a-skill` | Create concise agent skills with progressive disclosure. |

          ## Codex Adaptation

          - Flattened upstream plugin paths into `skills/<skill-name>` for direct Codex installation.
          - Renamed `setup-matt-pocock-skills` to `setup-real-engineer-skills` and made `AGENTS.md` the default Codex project instruction file.
          - Removed Claude-specific frontmatter unsupported by Codex skill validation.
          - Updated GitHub issue-tracker instructions to prefer the Codex GitHub connector, falling back to `gh` when needed.
          - Made multi-agent architecture exploration optional: use Codex multi-agent tools when available, otherwise perform independent passes directly.
          - Added `agents/openai.yaml` metadata for every skill.

          ## Verify

          ```bash
          python3 tests/validate_port.py
          ```

          ## Attribution

          This repository adapts MIT-licensed work from Matt Pocock's [`mattpocock/skills`](https://github.com/mattpocock/skills), "Skills For Real Engineers. Straight from my .claude directory."
          '''))

          (root / 'PORTING-AUDIT.md').write_text(dedent('''\
          # Porting Audit

          Source checked:

          - Repository: https://github.com/mattpocock/skills
          - Upstream commit used locally: `b8be62ffacb0118fa3eaa29a0923c87c8c11985c`
          - Scope: skills listed in upstream `.claude-plugin/plugin.json`

          The upstream repo contains deprecated, in-progress, personal, and misc skills in addition to the public plugin manifest. This Codex port treats the upstream plugin manifest as the function-complete public product surface.

          All 14 public plugin skills are ported. `setup-matt-pocock-skills` is intentionally renamed to `setup-real-engineer-skills` for Codex and now writes `AGENTS.md` by default.

          Codex-specific changes:

          - GitHub issue-tracker docs prefer the Codex GitHub connector, with `gh` as a fallback.
          - Claude-only frontmatter keys were removed.
          - Claude Agent-tool references were changed to optional Codex multi-agent usage with direct fallback.
          - `agents/openai.yaml` was generated for every skill.
          '''))

          (root / 'install.sh').write_text(dedent('''\
          #!/usr/bin/env bash
          set -euo pipefail

          repo_url="https://github.com/ArcQian-bit/codex-skills-for-real-engineers.git"
          source_dir="${CODEX_REAL_ENGINEER_SOURCE_DIR:-}"
          selected="${CODEX_REAL_ENGINEER_SKILLS:-all}"
          codex_home="${CODEX_HOME:-$HOME/.codex}"
          dest_root="$codex_home/skills"
          tmp_dir=""

          cleanup() {
            if [ -n "$tmp_dir" ] && [ -d "$tmp_dir" ]; then
              rm -rf "$tmp_dir"
            fi
          }
          trap cleanup EXIT

          if [ -z "$source_dir" ]; then
            tmp_dir="$(mktemp -d)"
            git clone --depth 1 "$repo_url" "$tmp_dir/repo" >/dev/null
            source_dir="$tmp_dir/repo"
          fi

          skills_root="$source_dir/skills"
          if [ ! -d "$skills_root" ]; then
            echo "No skills directory found at $skills_root" >&2
            exit 1
          fi

          mkdir -p "$dest_root"

          if [ "$selected" = "all" ]; then
            skills=()
            while IFS= read -r skill_name; do
              skills+=("$skill_name")
            done < <(find "$skills_root" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          else
            IFS=',' read -r -a skills <<< "$selected"
          fi

          for skill in "${skills[@]}"; do
            skill="$(echo "$skill" | xargs)"
            if [ -z "$skill" ]; then
              continue
            fi
            if [ ! -f "$skills_root/$skill/SKILL.md" ]; then
              echo "Unknown skill: $skill" >&2
              exit 1
            fi
            rm -rf "$dest_root/$skill"
            cp -R "$skills_root/$skill" "$dest_root/$skill"
            echo "Installed $skill -> $dest_root/$skill"
          done

          echo "Done. Restart Codex to pick up new skills."
          '''))

          (root / 'tests/validate_port.py').write_text(dedent('''\
          #!/usr/bin/env python3
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SKILLS = ROOT / "skills"
          EXPECTED = {
              "caveman", "diagnose", "grill-me", "grill-with-docs", "handoff",
              "improve-codebase-architecture", "prototype", "setup-real-engineer-skills",
              "tdd", "to-issues", "to-prd", "triage", "write-a-skill", "zoom-out",
          }
          REQUIRED = {
              "diagnose": ["scripts/hitl-loop.template.sh"],
              "grill-with-docs": ["CONTEXT-FORMAT.md", "ADR-FORMAT.md"],
              "triage": ["AGENT-BRIEF.md", "OUT-OF-SCOPE.md"],
              "improve-codebase-architecture": ["DEEPENING.md", "HTML-REPORT.md", "INTERFACE-DESIGN.md", "LANGUAGE.md"],
              "setup-real-engineer-skills": ["domain.md", "issue-tracker-github.md", "issue-tracker-gitlab.md", "issue-tracker-local.md", "triage-labels.md"],
              "tdd": ["deep-modules.md", "interface-design.md", "mocking.md", "refactoring.md", "tests.md"],
              "prototype": ["LOGIC.md", "UI.md"],
          }
          FORBIDDEN = ["disable-model-invocation", "argument-hint", "setup-matt-pocock-skills", "subagent_type=Explore", "using the Agent tool"]
          ALLOWED_KEYS = {"name", "description", "license", "allowed-tools", "metadata"}

          def assert_true(condition, message):
              if not condition:
                  raise AssertionError(message)

          def frontmatter(text):
              match = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
              assert_true(match is not None, "missing YAML frontmatter")
              return match.group(1)

          def keys(fm):
              return {line.split(":", 1)[0].strip() for line in fm.splitlines() if line and not line.startswith((" ", "-")) and ":" in line}

          def test_inventory():
              actual = {p.name for p in SKILLS.iterdir() if p.is_dir()}
              assert_true(actual == EXPECTED, f"unexpected skills: {sorted(actual ^ EXPECTED)}")

          def test_frontmatter():
              for name in EXPECTED:
                  text = (SKILLS / name / "SKILL.md").read_text()
                  fm = frontmatter(text)
                  assert_true(keys(fm) <= ALLOWED_KEYS, f"{name} has bad frontmatter")
                  assert_true(f"name: {name}" in fm, f"{name} name mismatch")
                  assert_true("description:" in fm, f"{name} missing description")

          def test_resources():
              for skill, paths in REQUIRED.items():
                  for rel in paths:
                      assert_true((SKILLS / skill / rel).exists(), f"{skill} missing {rel}")

          def test_metadata():
              for name in EXPECTED:
                  text = (SKILLS / name / "agents" / "openai.yaml").read_text()
                  assert_true("display_name:" in text, f"{name} missing display name")
                  assert_true(f"Use ${name}" in text, f"{name} default prompt mismatch")

          def test_forbidden():
              for path in SKILLS.rglob("*.md"):
                  text = path.read_text()
                  for forbidden in FORBIDDEN:
                      assert_true(forbidden not in text, f"{path} contains {forbidden}")

          def test_links():
              link_pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
              code_pattern = re.compile(r"```.*?```", re.DOTALL)
              for path in SKILLS.rglob("*.md"):
                  text = code_pattern.sub("", path.read_text())
                  for raw in link_pattern.findall(text):
                      target = raw.split("#", 1)[0]
                      if not target or re.match(r"^[a-z]+://", target) or target.startswith(("mailto:", "/")):
                          continue
                      assert_true((path.parent / target).resolve().exists(), f"{path} broken link {raw}")

          def main():
              for test in [test_inventory, test_frontmatter, test_resources, test_metadata, test_forbidden, test_links]:
                  test()
                  print(f"PASS {test.__name__}")

          if __name__ == "__main__":
              main()
          '''))
          PY

          chmod +x install.sh tests/validate_port.py skills/diagnose/scripts/hitl-loop.template.sh
          python3 tests/validate_port.py

      - name: Commit generated repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial Codex port of Skills For Real Engineers" || exit 0
          git push
