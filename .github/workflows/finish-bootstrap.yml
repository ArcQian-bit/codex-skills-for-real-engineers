name: Finish bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reuse bootstrap generator and repair tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/bootstrap.yml').read_text().splitlines()
          start = None
          for i, line in enumerate(lines):
              if line.strip() == '- name: Generate Codex port':
                  start = i
                  break
          if start is None:
              raise SystemExit('Generate step not found')
          run_line = None
          for i in range(start, len(lines)):
              if lines[i].strip() == 'run: |':
                  run_line = i
                  break
          if run_line is None:
              raise SystemExit('Run block not found')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line.strip() == '':
                  body.append('')
              else:
                  break
          script = '\n'.join(body).replace('python3 tests/validate_port.py', 'true') + '\n'
          Path('/tmp/generate-port.sh').write_text(script)
          PY

          bash /tmp/generate-port.sh

          cat > tests/validate_port.py <<'PY'
          #!/usr/bin/env python3
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SKILLS = ROOT / 'skills'
          EXPECTED = {
              'caveman', 'diagnose', 'grill-me', 'grill-with-docs', 'handoff',
              'improve-codebase-architecture', 'prototype', 'setup-real-engineer-skills',
              'tdd', 'to-issues', 'to-prd', 'triage', 'write-a-skill', 'zoom-out',
          }
          REQUIRED = {
              'diagnose': ['scripts/hitl-loop.template.sh'],
              'grill-with-docs': ['CONTEXT-FORMAT.md', 'ADR-FORMAT.md'],
              'triage': ['AGENT-BRIEF.md', 'OUT-OF-SCOPE.md'],
              'improve-codebase-architecture': ['DEEPENING.md', 'HTML-REPORT.md', 'INTERFACE-DESIGN.md', 'LANGUAGE.md'],
              'setup-real-engineer-skills': ['domain.md', 'issue-tracker-github.md', 'issue-tracker-gitlab.md', 'issue-tracker-local.md', 'triage-labels.md'],
              'tdd': ['deep-modules.md', 'interface-design.md', 'mocking.md', 'refactoring.md', 'tests.md'],
              'prototype': ['LOGIC.md', 'UI.md'],
          }
          FORBIDDEN = ['disable-model-invocation', 'argument-hint', 'setup-matt-pocock-skills', 'subagent_type=Explore', 'using the Agent tool']
          ALLOWED_KEYS = {'name', 'description', 'license', 'allowed-tools', 'metadata'}

          def assert_true(condition, message):
              if not condition:
                  raise AssertionError(message)

          def frontmatter(text):
              match = re.match(r'^---\n(.*?)\n---', text, re.DOTALL)
              assert_true(match is not None, 'missing YAML frontmatter')
              return match.group(1)

          def keys(fm):
              return {line.split(':', 1)[0].strip() for line in fm.splitlines() if line and not line.startswith((' ', '-')) and ':' in line}

          def test_inventory():
              actual = {p.name for p in SKILLS.iterdir() if p.is_dir()}
              assert_true(actual == EXPECTED, f'unexpected skills: {sorted(actual ^ EXPECTED)}')

          def test_frontmatter():
              for name in EXPECTED:
                  text = (SKILLS / name / 'SKILL.md').read_text()
                  fm = frontmatter(text)
                  assert_true(keys(fm) <= ALLOWED_KEYS, f'{name} has bad frontmatter')
                  assert_true(f'name: {name}' in fm, f'{name} name mismatch')
                  assert_true('description:' in fm, f'{name} missing description')

          def test_resources():
              for skill, paths in REQUIRED.items():
                  for rel in paths:
                      assert_true((SKILLS / skill / rel).exists(), f'{skill} missing {rel}')

          def test_metadata():
              for name in EXPECTED:
                  text = (SKILLS / name / 'agents' / 'openai.yaml').read_text()
                  assert_true('display_name:' in text, f'{name} missing display name')
                  assert_true(f'Use ${name}' in text, f'{name} default prompt mismatch')

          def test_forbidden():
              for path in SKILLS.rglob('*.md'):
                  text = path.read_text()
                  for forbidden in FORBIDDEN:
                      assert_true(forbidden not in text, f'{path} contains {forbidden}')

          def test_links():
              link_pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
              code_pattern = re.compile(r'```.*?```', re.DOTALL)
              for path in SKILLS.rglob('*.md'):
                  text = code_pattern.sub('', path.read_text())
                  for raw in link_pattern.findall(text):
                      target = raw.split('#', 1)[0]
                      if not target or re.match(r'^[a-z]+://', target) or target.startswith(('mailto:', '/')):
                          continue
                      assert_true((path.parent / target).resolve().exists(), f'{path} broken link {raw}')

          def main():
              for test in [test_inventory, test_frontmatter, test_resources, test_metadata, test_forbidden, test_links]:
                  test()
                  print(f'PASS {test.__name__}')

          if __name__ == '__main__':
              main()
          PY

          chmod +x install.sh tests/validate_port.py skills/diagnose/scripts/hitl-loop.template.sh
          python3 tests/validate_port.py

      - name: Commit generated repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial Codex port of Skills For Real Engineers" || exit 0
          git push
