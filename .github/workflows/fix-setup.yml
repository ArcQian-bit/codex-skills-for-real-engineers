name: Patch setup skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch generated file
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/`to-issues`, `triage`, `to-prd`, and `qa`/`to-issues`, `triage`, and `to-prd`/' skills/setup-real-engineer-skills/SKILL.md
          git rm .github/workflows/fix-setup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/setup-real-engineer-skills/SKILL.md
          git commit -m "Remove deprecated qa reference from setup skill" || exit 0
          git push
